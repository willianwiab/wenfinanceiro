<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrativo · WEN</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#17243c;font:16px system-ui,sans-serif}header{background:#142947;color:white;padding:24px max(20px,calc((100vw - 1150px)/2));display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:24px;margin:0}header p{color:#c7d5e6;margin:6px 0 0}main{max-width:1150px;margin:28px auto;padding:0 20px}button,.button{font:inherit;border:1px solid #cbd5e1;border-radius:8px;padding:10px 14px;background:white;color:#17243c;cursor:pointer;text-decoration:none}button.primary{background:#176744;color:white;border-color:#176744}button:disabled{opacity:.5;cursor:wait}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #4a90df;outline-offset:2px}input,textarea,select{width:100%;font:inherit;padding:10px;border:1px solid #bac7d7;border-radius:7px;margin:6px 0 16px;color:#17243c;background:white}textarea{line-height:1.5}label{font-size:14px;font-weight:600}section,.card{background:white;border:1px solid #dce4ee;border-radius:12px;padding:24px;margin-bottom:18px}.login{max-width:420px;margin:60px auto}.layout{display:grid;grid-template-columns:300px 1fr;gap:22px}.list button{width:100%;text-align:left;margin-bottom:10px;line-height:1.5}.list button.active{border:2px solid #176744;background:#edf7f1}.muted{color:#566780;font-size:14px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.status{padding:10px 14px;background:#edf2f8;border-radius:7px;margin-bottom:16px;line-height:1.5}.error{color:#9a2020;background:#fff0f0}.actions{display:flex;gap:10px;flex-wrap:wrap}table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:10px 4px;border-bottom:1px solid #dce4ee}pre{white-space:pre-wrap;font:inherit;line-height:1.6}details{margin:20px 0}#printArea{display:none}[hidden]{display:none!important}@media(max-width:800px){.layout{grid-template-columns:1fr}header{align-items:start}section{padding:18px}.row{display:block}}@media print{body>*{display:none!important}#printArea{display:block!important;padding:30px;background:white}#printArea h1{color:#142947}}
</style></head><body><header><div><h1>WEN · Administrativo</h1><p>Fechamentos, cobranças e notas</p></div><button id="sair" hidden>Sair</button></header><main><div id="aviso" role="status"></div><section id="login" class="login"><h2>Acessar administrativo</h2><form id="loginForm"><label>E-mail<input id="email" type="email" autocomplete="username" required value="financeiro@wenprodutora.com.br"></label><label>Senha<input id="senha" type="password" autocomplete="current-password" required></label><button class="primary" id="entrar">Entrar</button><button type="button" id="redefinir">Definir / recuperar senha</button><button type="button" id="verificar" hidden>Verificar meu e-mail</button></form></section><div id="app" hidden><div class="row"><label>Buscar cliente ou fechamento<input id="busca" type="search" placeholder="Nome do cliente"></label><label>Cobrança<select id="filtro"><option value="">Todas</option><option value="pendente">Pendente</option><option value="enviada">Enviada</option><option value="pago">Pago</option><option value="atrasada">Em atraso</option></select></label><button id="atualizar">Atualizar</button></div><div class="layout"><aside id="lista" class="list" aria-label="Fechamentos"></aside><section id="editor"><p>Selecione um fechamento.</p></section></div></div></main><article id="printArea"></article><script src="js/fechamentos.js"></script><script src="js/administrativo.js"></script></body></html>
